components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token issued by `/api/v1/auth/login` or MFA verification.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: HMAC signature over the raw request body using the provider secret.
  headers:
    XRequestId:
      description: Correlation id echoed from the request or generated by the server.
      schema:
        type: string
    IdempotencyReplayed:
      description: True when the response was replayed from a stored idempotency record.
      schema:
        type: boolean
    RateLimitLimit:
      description: Request quota for the current window.
      schema:
        type: integer
        minimum: 0
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the current rate-limit window resets.
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque forward cursor from a previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 500
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    From:
      name: from
      in: query
      required: false
      description: Inclusive lower bound. Defaults are endpoint-specific.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: Exclusive upper bound. Defaults are endpoint-specific.
      schema:
        type: string
        format: date-time
    Query:
      name: query
      in: query
      required: false
      description: Free-text search over doctor name, specialization, and bio.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    Specialization:
      name: specialization
      in: query
      required: false
      schema:
        type: string
        minLength: 2
        maxLength: 120
    Language:
      name: language
      in: query
      required: false
      description: ISO 639-1 language code.
      schema:
        type: string
        pattern: '^[a-z]{2}$'
    City:
      name: city
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 120
    MinFeeCents:
      name: minFeeCents
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    MaxFeeCents:
      name: maxFeeCents
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    AvailableFrom:
      name: availableFrom
      in: query
      required: false
      description: Return doctors with at least one available slot on or after this time.
      schema:
        type: string
        format: date-time
    AvailableTo:
      name: availableTo
      in: query
      required: false
      description: Upper bound paired with availableFrom.
      schema:
        type: string
        format: date-time
    AvailabilityFrom:
      name: from
      in: query
      required: false
      description: Inclusive start time.
      schema:
        type: string
        format: date-time
    AvailabilityTo:
      name: to
      in: query
      required: false
      description: Exclusive end time.
      schema:
        type: string
        format: date-time
    DoctorSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [rating_desc, fee_asc, fee_desc, next_available]
        default: rating_desc
    DoctorId:
      name: doctorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DoctorIdFilter:
      name: doctorId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    DoctorVerificationFilter:
      name: verificationStatus
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/DoctorVerificationStatus'
    ConsultationId:
      name: consultationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsultationStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ConsultationStatus'
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PrescriptionId:
      name: prescriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentProviderPath:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PaymentProvider'
    Interval:
      name: interval
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AnalyticsInterval'
    AuditActorId:
      name: actorId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AuditAction:
      name: action
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 120
    AuditResourceType:
      name: resourceType
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 120
    AuditResourceId:
      name: resourceId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated key scoped to the authenticated actor, method, and route.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: '^[A-Za-z0-9._:-]+$'
    WebhookSignature:
      name: X-Webhook-Signature
      in: header
      required: true
      description: Hex-encoded HMAC-SHA256 of the raw body.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
  responses:
    BadRequest:
      description: Malformed request or invalid query parameters.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, expired, or revoked authentication.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not allowed to access this resource.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with current state, an active idempotency record, or a uniqueness rule.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Semantically invalid input, invalid state transition, or idempotency-key reuse.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Locked:
      description: The account is temporarily locked after repeated failed logins.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server failure. The request id is safe to share when reporting it.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required dependency is unavailable or the process is shutting down.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: [string, 'null']
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              examples: [VALIDATION_ERROR, SLOT_UNAVAILABLE, IDEMPOTENCY_KEY_REUSED]
            message:
              type: string
            requestId:
              type: string
            details:
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/ErrorDetail'
                - type: object
                  additionalProperties: true
    PageInfo:
      type: object
      additionalProperties: false
      required: [hasMore, nextCursor]
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type: [string, 'null']
    UserRole:
      type: string
      enum: [patient, doctor, admin]
    UserStatus:
      type: string
      enum: [pending, active, suspended, deleted]
    Gender:
      type: string
      enum: [female, male, non_binary, prefer_not_to_say]
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, email, role, status, fullName, mfaEnabled, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        fullName:
          type: string
        mfaEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    User:
      type: object
      additionalProperties: false
      required:
        [
          id,
          email,
          role,
          status,
          emailVerifiedAt,
          mfaEnabled,
          fullName,
          locale,
          timezone,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        mfaEnabled:
          type: boolean
        fullName:
          type: string
        dateOfBirth:
          type: [string, 'null']
          format: date
        phone:
          type: [string, 'null']
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        locale:
          type: string
        timezone:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Money:
      type: object
      additionalProperties: false
      required: [amountCents, currency]
      properties:
        amountCents:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, fullName, phone, acceptedTerms]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: At least 12 characters. Common and breached passwords are rejected.
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        dateOfBirth:
          type: [string, 'null']
          format: date
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        acceptedTerms:
          type: boolean
          const: true
    RegistrationResponse:
      type: object
      additionalProperties: false
      required: [userId, email, verificationRequired, message]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        verificationRequired:
          type: boolean
          const: true
        message:
          type: string
