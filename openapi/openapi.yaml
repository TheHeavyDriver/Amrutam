openapi: 3.1.0
info:
  title: Amrutam Telemedicine API
  version: 1.0.0
  summary: Telemedicine booking, consultation, prescription, payment, and audit APIs.
  description: |
    Contract for the Amrutam telemedicine backend. All non-health routes are
    served under `/api/v1`; probes remain at `/health`, `/health/live`, and
    `/health/ready`.

    **Authentication.** Protected operations use a short-lived bearer access
    token. Refresh tokens rotate on every use; replaying a rotated token revokes
    the session family. Doctor and admin accounts require TOTP MFA. Role and
    resource ownership are enforced server-side; hiding a route is not an
    authorization control.

    **Writes and idempotency.** Operations marked with the `Idempotency-Key`
    header require a caller-generated key of 8–255 characters. The key is scoped
    to the authenticated actor and route. Replaying a request with the same
    fingerprint returns the original response and sets `Idempotency-Replayed:
    true`. Reusing a key with a different body returns `422
    IDEMPOTENCY_KEY_REUSED`. Concurrent duplicates may return `409
    IDEMPOTENCY_IN_PROGRESS`.

    **Pagination.** List endpoints use opaque forward cursors. Pass
    `page.nextCursor` as `cursor`; a null cursor means no further pages. Limits
    default to 20 and are capped at 100.

    **Errors.** Every error uses the shared envelope with a stable machine code,
    a human-readable message, the request id, and optional field details.

    **Correlation and limits.** Every response includes `X-Request-Id`. Rate
    limited responses include `RateLimit-Limit`, `RateLimit-Remaining`,
    `RateLimit-Reset`, and `Retry-After`. Clients must treat limits as
    server-controlled and back off on `429`.

    **Clinical data.** Timestamps are RFC 3339 UTC values. Money is integer minor
    units in the stated ISO 4217 currency. Audit records contain hashes and
    metadata, never raw clinical free text. Client-supplied user agents and IPs
    are untrusted metadata.
  contact:
    name: Amrutam Platform Engineering
    email: platform@amrutam.local
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Health
    description: Liveness and readiness probes. These routes are not versioned.
  - name: Auth
    description: Registration, verification, sessions, password reset, and TOTP MFA.
  - name: Users
    description: The authenticated caller's profile and credentials.
  - name: Doctors
    description: Public doctor discovery and availability.
  - name: Bookings
    description: Slot reservation and consultation lifecycle.
  - name: Payments
    description: Consultation payment intents, confirmation, refunds, and provider callbacks.
  - name: Prescriptions
    description: Versioned prescriptions and signed documents.
  - name: Admin
    description: Doctor verification, analytics, and audit access. Admin role required.
  - name: Webhooks
    description: Signed provider callbacks. Not authenticated with bearer tokens.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Service health snapshot
      security: []
      responses:
        '200':
          description: The process is running.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe
      description: Checks required dependencies. Returns 503 while the service cannot safely receive traffic.
      security: []
      responses:
        '200':
          description: Dependencies are ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a patient account
      description: Creates a pending patient account and sends an email verification token. Doctors are onboarded through the admin workflow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; email verification required.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate with email and password
      description: Returns a session, or an MFA challenge when the account requires a TOTP code. Repeated failures trigger temporary lockout.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session issued, or MFA challenge returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate a refresh token
      description: Invalidates the presented refresh token and returns a new token pair. Reuse of a rotated token revokes the session family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke a refresh-token session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify an email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Resend an email verification link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset
      description: Always returns the same response so account existence is not disclosed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Complete a password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset; all sessions are revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: verifyMfaChallenge
      summary: Complete login with a TOTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaChallengeVerifyRequest'
      responses:
        '200':
          description: MFA accepted; session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/mfa/setup:
    post:
      tags: [Auth]
      operationId: setupMfa
      summary: Begin TOTP MFA enrollment
      description: Doctor and admin accounts only. The secret is returned once and must be stored encrypted by the server.
      responses:
        '200':
          description: TOTP enrollment material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/mfa/enable:
    post:
      tags: [Auth]
      operationId: enableMfa
      summary: Confirm TOTP enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '200':
          description: MFA enabled and recovery codes issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnableResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/mfa/disable:
    post:
      tags: [Auth]
      operationId: disableMfa
      summary: Disable TOTP MFA
      description: Requires the current password and a valid TOTP code. Not permitted for active doctor/admin accounts if policy requires MFA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
      responses:
        '200':
          description: MFA disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Read the authenticated user
      responses:
        '200':
          description: Current user and profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: Update the authenticated user's profile
      description: Email and role changes are not self-service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated user and profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/me/password:
    post:
      tags: [Users]
      operationId: changePassword
      summary: Change the authenticated user's password
      description: Revokes all other sessions on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/doctors:
    get:
      tags: [Doctors]
      operationId: listDoctors
      summary: Search verified doctors
      description: Only verified doctors are returned. Results use deterministic sorting with a cursor.
      security: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Specialization'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/MinFeeCents'
        - $ref: '#/components/parameters/MaxFeeCents'
        - $ref: '#/components/parameters/AvailableFrom'
        - $ref: '#/components/parameters/AvailableTo'
        - $ref: '#/components/parameters/DoctorSort'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Doctor page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/doctors/{doctorId}:
    get:
      tags: [Doctors]
      operationId: getDoctor
      summary: Read a verified doctor profile
      security: []
      parameters:
        - $ref: '#/components/parameters/DoctorId'
      responses:
        '200':
          description: Doctor details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/doctors/{doctorId}/availability:
    get:
      tags: [Doctors]
      operationId: listDoctorAvailability
      summary: List a doctor's bookable slots
      description: Returns UTC slots. Defaults to the next 14 days when no range is supplied.
      security: []
      parameters:
        - $ref: '#/components/parameters/DoctorId'
        - $ref: '#/components/parameters/AvailabilityFrom'
        - $ref: '#/components/parameters/AvailabilityTo'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Availability page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/bookings:
    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Reserve a slot and create a consultation
      description: Patient-only. A slot can back at most one consultation; the database enforces exclusive occupancy.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Consultation created and slot reserved.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Bookings]
      operationId: listBookings
      summary: List consultations visible to the caller
      description: Patients see their own consultations; doctors see consultations assigned to them; admins may filter across the platform.
      parameters:
        - $ref: '#/components/parameters/ConsultationStatusFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Consultation page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/bookings/{consultationId}:
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Read a consultation
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
      responses:
        '200':
          description: Consultation details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/bookings/{consultationId}/cancel:
    post:
      tags: [Bookings]
      operationId: cancelBooking
      summary: Cancel a consultation
      description: Patient or admin. Terminal consultations cannot be cancelled.
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingRequest'
      responses:
        '200':
          description: Consultation cancelled.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/bookings/{consultationId}/reschedule:
    post:
      tags: [Bookings]
      operationId: rescheduleBooking
      summary: Move a consultation to another slot
      description: Reserving the new slot and releasing the old claim is transactional. Only scheduled consultations can move.
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleBookingRequest'
      responses:
        '200':
          description: Consultation rescheduled.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/bookings/{consultationId}/join-token:
    post:
      tags: [Bookings]
      operationId: createJoinToken
      summary: Issue a short-lived consultation join token
      description: Patient or assigned doctor. Tokens are hashed at rest and are not reusable after expiry.
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
      responses:
        '200':
          description: Join token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/bookings/{consultationId}/start:
    post:
      tags: [Bookings]
      operationId: startConsultation
      summary: Start a consultation
      description: Assigned doctor only. Transition is scheduled → in_progress.
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Consultation started.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/bookings/{consultationId}/complete:
    post:
      tags: [Bookings]
      operationId: completeConsultation
      summary: Complete a consultation
