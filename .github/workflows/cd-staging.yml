name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/amrutam-api

jobs:
  deploy:
    name: Build, migrate, deploy, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Pin image and apply migration gate
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          sed -i "s|ghcr.io/example/amrutam-api:latest|${IMAGE}|g" \
            infra/k8s/base/api-deployment.yaml \
            infra/k8s/base/worker-deployment.yaml \
            infra/k8s/jobs/migrate.yaml
          kubectl apply -f infra/k8s/base/namespace.yaml
          kubectl apply -f infra/k8s/base/configmap.yaml
          if ! kubectl get secret amrutam-secrets -n amrutam >/dev/null 2>&1; then
            echo "amrutam-secrets must be provisioned before migration (see infra/k8s/README.md)" >&2
            exit 1
          fi
          kubectl delete job amrutam-migrate -n amrutam --ignore-not-found
          kubectl apply -f infra/k8s/jobs/migrate.yaml
          kubectl wait --for=condition=complete --timeout=300s job/amrutam-migrate -n amrutam
      - name: Roll out staging
        run: |
          kubectl apply -k infra/k8s/overlays/staging
          kubectl rollout status deploy/amrutam-api -n amrutam --timeout=10m
          kubectl rollout status deploy/amrutam-worker -n amrutam --timeout=10m
      - name: Smoke test
        env:
          API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
        run: |
          set -euo pipefail
          curl --fail --retry 10 --retry-delay 3 --max-time 10 "${API_BASE_URL}/health/ready"
          curl --fail --retry 10 --retry-delay 3 --max-time 10 "${API_BASE_URL}/api/v1/doctors?limit=1"
      - name: Roll back application on failure
        if: failure()
        run: |
          kubectl rollout undo deploy/amrutam-api -n amrutam || true
          kubectl rollout undo deploy/amrutam-worker -n amrutam || true
          kubectl rollout status deploy/amrutam-api -n amrutam --timeout=5m || true
          kubectl rollout status deploy/amrutam-worker -n amrutam --timeout=5m || true
