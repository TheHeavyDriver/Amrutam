global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # OTLP metrics exported by the collector (when instrumentation emits them).
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: amrutam-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
    honor_labels: true

  - job_name: amrutam-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9464']
    honor_labels: true
