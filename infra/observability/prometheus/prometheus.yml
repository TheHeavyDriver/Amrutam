global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # OTLP metrics exported by the collector.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  # The API exposes Prometheus metrics from Phase 3 onwards.
  - job_name: amrutam-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
    # Keep the scrape job valid while the optional API profile is not running.
    honor_labels: true
