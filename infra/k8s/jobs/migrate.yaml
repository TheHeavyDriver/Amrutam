apiVersion: batch/v1
kind: Job
metadata:
  name: amrutam-migrate
  namespace: amrutam
  labels:
    app.kubernetes.io/name: amrutam-migrate
    app.kubernetes.io/part-of: amrutam
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amrutam-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: amrutam-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/example/amrutam-api:latest
          command: ['node', 'dist/database/cli.js', 'up']
          envFrom:
            - configMapRef:
                name: amrutam-config
            - secretRef:
                name: amrutam-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
