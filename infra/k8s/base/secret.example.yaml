# NOT applied by kustomize. Create this Secret via External Secrets, Sealed
# Secrets, or a password manager. Never commit a populated version.
apiVersion: v1
kind: Secret
metadata:
  name: amrutam-secrets
  namespace: amrutam
type: Opaque
stringData:
  DATABASE_URL: postgresql://amrutam:REPLACE_ME@rds-endpoint:5432/amrutam
  REDIS_URL: rediss://:REPLACE_ME@elasticache-endpoint:6379
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARS
  JWT_MFA_SECRET: REPLACE_WITH_INDEPENDENT_RANDOM_CHARS
  AUTH_TOKEN_PEPPER: REPLACE_WITH_INDEPENDENT_RANDOM_CHARS
  AUTH_ENCRYPTION_KEY: REPLACE_WITH_BASE64_32_BYTES
  PAYMENT_WEBHOOK_SECRET: REPLACE_WITH_PROVIDER_SHARED_SECRET
