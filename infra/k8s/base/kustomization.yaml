apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: amrutam
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - api-service.yaml
  - api-deployment.yaml
  - worker-service.yaml
  - worker-deployment.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
    includeTemplates: true
