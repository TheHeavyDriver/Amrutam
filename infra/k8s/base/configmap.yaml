apiVersion: v1
kind: ConfigMap
metadata:
  name: amrutam-config
  namespace: amrutam
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: '3000'
  API_GLOBAL_PREFIX: api/v1
  BODY_LIMIT_BYTES: '1048576'
  TRUST_PROXY: 'true'
  CORS_ORIGINS: https://app.example.com
  APP_PUBLIC_URL: https://api.example.com
  LOG_LEVEL: info
  LOG_PRETTY: 'false'
  DATABASE_POOL_MAX: '20'
  CACHE_ENABLED: 'true'
  AUTH_REQUIRE_EMAIL_VERIFICATION: 'true'
  AUTH_ACCESS_TOKEN_TTL_SECONDS: '900'
  AUTH_MFA_TOKEN_TTL_SECONDS: '300'
  AUTH_REFRESH_TOKEN_TTL_SECONDS: '2592000'
  AUTH_EMAIL_VERIFICATION_TTL_SECONDS: '86400'
  AUTH_PASSWORD_RESET_TTL_SECONDS: '3600'
  AUTH_MAX_LOGIN_ATTEMPTS: '5'
  AUTH_LOCKOUT_SECONDS: '900'
  PRESCRIPTION_DOCUMENT_URL_TTL_SECONDS: '300'
  RATE_LIMIT_MAX: '300'
  RATE_LIMIT_WINDOW_SECONDS: '60'
  OUTBOX_POLL_INTERVAL_MS: '1000'
  OUTBOX_BATCH_SIZE: '25'
  OUTBOX_MAX_ATTEMPTS: '10'
  OUTBOX_LOCK_TIMEOUT_SECONDS: '60'
  OUTBOX_BACKOFF_BASE_MS: '1000'
  OUTBOX_BACKOFF_MAX_MS: '300000'
  SCHEDULER_INTERVAL_MS: '30000'
  WORKER_METRICS_PORT: '9464'
  OTEL_ENABLED: 'true'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
