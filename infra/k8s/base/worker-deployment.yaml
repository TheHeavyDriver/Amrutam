apiVersion: apps/v1
kind: Deployment
metadata:
  name: amrutam-worker
  namespace: amrutam
  labels:
    app.kubernetes.io/name: amrutam-worker
    app.kubernetes.io/part-of: amrutam
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: amrutam-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amrutam-worker
        app.kubernetes.io/part-of: amrutam
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9464'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: amrutam-worker
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: amrutam-worker
      containers:
        - name: worker
          image: ghcr.io/example/amrutam-api:latest
          imagePullPolicy: IfNotPresent
          command: ['node', 'dist/worker.js']
          ports:
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: amrutam-config
            - secretRef:
                name: amrutam-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: amrutam-worker
            - name: METRICS_SERVICE_NAME
              value: amrutam-worker
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health/live
              port: metrics
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
