# Example ExternalSecret using the External Secrets Operator and IRSA. The
# Terraform output `app_secret_arn` is a JSON object whose keys match the
# amrutam-secrets Secret consumed by the Deployments. Do not apply this without
# configuring a ClusterSecretStore and workload identity.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: amrutam-secrets
  namespace: amrutam
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: amrutam-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: amrutam/prod/app
