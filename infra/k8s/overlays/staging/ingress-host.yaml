apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amrutam-api
  namespace: amrutam
spec:
  tls:
    - hosts: [api.staging.example.com]
      secretName: amrutam-api-tls
  rules:
    - host: api.staging.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: amrutam-api
                port:
                  name: http
