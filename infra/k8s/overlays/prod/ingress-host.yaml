apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amrutam-api
  namespace: amrutam
spec:
  tls:
    - hosts: [api.amrutam.example]
      secretName: amrutam-api-tls
  rules:
    - host: api.amrutam.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: amrutam-api
                port:
                  name: http
